<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta name="theme-color" content="#317EFB"/>
    <!-- キャッシュを無効化するためのメタタグ -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>3D CAD AR アプリケーション</title>
    <link rel="stylesheet" href="style.css?v=20250515">
    <link rel="manifest" href="manifest.json?v=20250515">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body>
    <div id="loading-screen">
        <div class="loading-container">
            <h1>3D CAD AR アプリ</h1>
            <p>カメラへのアクセスを許可してください。</p>
            <div class="loader"></div>
        </div>
    </div>

    <div id="instructions">
        <p>マーカーにカメラを向けてください</p>
        <button id="close-instructions">閉じる</button>
    </div>

    <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;"
             renderer="logarithmicDepthBuffer: true; antialias: true; precision: mediump;"
             vr-mode-ui="enabled: false"
             style="width: 100vw; height: 100vh; position: fixed; top: 0; left: 0;">
        <!-- カメラ -->
        <a-entity camera></a-entity>
        
        <!-- デフォルトの3Dモデル（赤い箱） -->
         <a-marker preset="hiro">
            <a-entity id="ar-model" position="0.2 0.7 2.6" rotation="270 0 0" scale="2 2 2" gltf-model="./models/poop.glb"></a-entity> ああ
         </a-marker>
    </a-scene>

    <!-- デバッグパネル（PC限定） -->
    <div id="debug-panel" class="debug-panel">
        <h3>デバッグコントロール</h3>
        <button id="toggle-debug" class="toggle-debug-btn">▼</button>
        
        <div id="debug-controls" class="debug-controls">
            <!-- Position Controls -->
            <div class="control-group">
                <h4>Position</h4>
                <div class="slider-group">
                    <label>X: <span id="pos-x-value">2</span></label>
                    <input type="range" id="pos-x" min="-10" max="10" step="0.1" value="2">
                </div>
                <div class="slider-group">
                    <label>Y: <span id="pos-y-value">0.7</span></label>
                    <input type="range" id="pos-y" min="-10" max="10" step="0.1" value="0.7">
                </div>
                <div class="slider-group">
                    <label>Z: <span id="pos-z-value">4.4</span></label>
                    <input type="range" id="pos-z" min="-10" max="10" step="0.1" value="4.4">
                </div>
            </div>

            <!-- Scale Controls -->
            <div class="control-group">
                <h4>Scale</h4>
                <div class="slider-group">
                    <label>X: <span id="scale-x-value">2</span></label>
                    <input type="range" id="scale-x" min="0.1" max="5" step="0.1" value="2">
                </div>
                <div class="slider-group">
                    <label>Y: <span id="scale-y-value">2</span></label>
                    <input type="range" id="scale-y" min="0.1" max="5" step="0.1" value="2">
                </div>
                <div class="slider-group">
                    <label>Z: <span id="scale-z-value">2</span></label>
                    <input type="range" id="scale-z" min="0.1" max="5" step="0.1" value="2">
                </div>
            </div>

            <!-- Visibility Area Controls -->
            <div class="control-group">
                <h4>可視領域</h4>
                <div class="slider-group">
                    <label>領域サイズ: <span id="visibility-area-value">2.0</span>m</label>
                    <input type="range" id="visibility-area" min="0.5" max="10" step="0.1" value="2.0">
                </div>
                <div class="slider-group">
                    <label>
                        <input type="checkbox" id="enable-visibility-check" checked>
                        可視領域チェックを有効にする
                    </label>
                </div>
                <div class="info-display">
                    <small>現在の状態: <span id="visibility-status">範囲内</span></small><br>
                    <small>距離: <span id="distance-display">0.0</span>m</small>
                </div>
            </div>

            <!-- Reset Button -->
            <button id="reset-model" class="reset-btn">リセット</button>
        </div>
    </div>

    <script src="app.js?v=20250515"></script>
    <script>
        // サービスワーカーの登録と更新
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // 既存のサービスワーカーを強制的に更新
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    for(let registration of registrations) {
                        registration.update();
                    }
                });
                
                navigator.serviceWorker.register('sw.js?v=20250515')
                    .then(reg => {
                        console.log('Service Worker registered', reg);
                        // サービスワーカーの更新をチェック
                        reg.onupdatefound = function() {
                            const installingWorker = reg.installing;
                            installingWorker.onstatechange = function() {
                                if (installingWorker.state === 'installed') {
                                    if (navigator.serviceWorker.controller) {
                                        console.log('新しいサービスワーカーがインストールされました');
                                        // 新しいバージョンがインストールされたらページをリロード
                                        window.location.reload();
                                    }
                                }
                            };
                        }
                    })
                    .catch(err => console.log('Service Worker registration failed', err));
            });
        }
    </script>
</body>
</html>
