<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Model Viewer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body>
    <!-- ARシーン -->
    <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
             renderer="precision: mediump;" vr-mode-ui="enabled: false">
        <a-entity camera></a-entity>
        <a-marker preset="hiro">
            <a-entity id="ar-model" position="0.2 0.7 2.6" rotation="270 0 0" scale="20 20 20" 
                      gltf-model="./models/poop.glb"></a-entity>
        </a-marker>
    </a-scene>

    <!-- コントロールパネル -->
    <div id="controls">
        <button id="toggle-controls">⚙️</button>
        <div id="control-panel" class="hidden">
            <h4>調整</h4>
            <div class="control-row">
                <label>位置 X</label>
                <input type="range" id="pos-x" min="-10" max="10" step="0.5" value="0.2">
                <span id="pos-x-val">0.2</span>
            </div>
            <div class="control-row">
                <label>位置 Y</label>
                <input type="range" id="pos-y" min="-10" max="10" step="0.5" value="0.7">
                <span id="pos-y-val">0.7</span>
            </div>
            <div class="control-row">
                <label>位置 Z</label>
                <input type="range" id="pos-z" min="-10" max="10" step="0.5" value="2.6">
                <span id="pos-z-val">2.6</span>
            </div>
            <div class="control-row">
                <label>サイズ</label>
                <input type="range" id="scale" min="1" max="50" step="1" value="20">
                <span id="scale-val">20</span>
            </div>
            <div class="control-buttons">
                <button id="reset">リセット</button>
                <button id="hide">非表示</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
