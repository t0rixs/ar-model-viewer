<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#317EFB"/>
    <!-- キャッシュを無効化するためのメタタグ -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>3D CAD AR アプリケーション</title>
    <link rel="stylesheet" href="style.css?v=20250515">
    <link rel="manifest" href="manifest.json?v=20250515">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body>
    <div id="loading-screen">
        <div class="loading-container">
            <h1>3D CAD AR アプリ</h1>
            <p>カメラへのアクセスを許可してください。</p>
            <div class="loader"></div>
        </div>
    </div>

    <div id="instructions">
        <p>マーカーにカメラを向けてください</p>
        <button id="close-instructions">閉じる</button>
    </div>

    <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
             renderer="logarithmicDepthBuffer: true; antialias: true; precision: mediump;"
             vr-mode-ui="enabled: false">
        <!-- カメラ -->
        <a-entity camera></a-entity>
        
        <!-- デフォルトの3Dモデル（赤い箱） -->
         <a-marker preset="hiro">
            <a-entity id="ar-model" position="0 0 0" rotation="90 0 0" scale="0.3 0.3 0.3" gltf-model="./models/poop.glb"></a-entity> ああ
         </a-marker>
    </a-scene>

    <!-- デバッグパネル（PC限定） -->
    <div id="debug-panel" class="debug-panel">
        <h3>デバッグコントロール</h3>
        <button id="toggle-debug" class="toggle-debug-btn">▼</button>
        
        <div id="debug-controls" class="debug-controls">
            <!-- Position Controls -->
            <div class="control-group">
                <h4>Position</h4>
                <div class="slider-group">
                    <label>X: <span id="pos-x-value">0</span></label>
                    <input type="range" id="pos-x" min="-5" max="5" step="0.1" value="0">
                </div>
                <div class="slider-group">
                    <label>Y: <span id="pos-y-value">0</span></label>
                    <input type="range" id="pos-y" min="-5" max="5" step="0.1" value="0">
                </div>
                <div class="slider-group">
                    <label>Z: <span id="pos-z-value">0</span></label>
                    <input type="range" id="pos-z" min="-5" max="5" step="0.1" value="0">
                </div>
            </div>

            <!-- Rotation Controls -->
            <div class="control-group">
                <h4>Rotation</h4>
                <div class="slider-group">
                    <label>X: <span id="rot-x-value">90</span>°</label>
                    <input type="range" id="rot-x" min="0" max="360" step="1" value="90">
                </div>
                <div class="slider-group">
                    <label>Y: <span id="rot-y-value">0</span>°</label>
                    <input type="range" id="rot-y" min="0" max="360" step="1" value="0">
                </div>
                <div class="slider-group">
                    <label>Z: <span id="rot-z-value">0</span>°</label>
                    <input type="range" id="rot-z" min="0" max="360" step="1" value="0">
                </div>
            </div>

            <!-- Scale Controls -->
            <div class="control-group">
                <h4>Scale</h4>
                <div class="slider-group">
                    <label>X: <span id="scale-x-value">0.3</span></label>
                    <input type="range" id="scale-x" min="0.1" max="2" step="0.1" value="0.3">
                </div>
                <div class="slider-group">
                    <label>Y: <span id="scale-y-value">0.3</span></label>
                    <input type="range" id="scale-y" min="0.1" max="2" step="0.1" value="0.3">
                </div>
                <div class="slider-group">
                    <label>Z: <span id="scale-z-value">0.3</span></label>
                    <input type="range" id="scale-z" min="0.1" max="2" step="0.1" value="0.3">
                </div>
            </div>

            <!-- Reset Button -->
            <button id="reset-model" class="reset-btn">リセット</button>
        </div>
    </div>

    <script src="app.js?v=20250515"></script>
    <script>
        // サービスワーカーの登録と更新
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // 既存のサービスワーカーを強制的に更新
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    for(let registration of registrations) {
                        registration.update();
                    }
                });
                
                navigator.serviceWorker.register('sw.js?v=20250515')
                    .then(reg => {
                        console.log('Service Worker registered', reg);
                        // サービスワーカーの更新をチェック
                        reg.onupdatefound = function() {
                            const installingWorker = reg.installing;
                            installingWorker.onstatechange = function() {
                                if (installingWorker.state === 'installed') {
                                    if (navigator.serviceWorker.controller) {
                                        console.log('新しいサービスワーカーがインストールされました');
                                        // 新しいバージョンがインストールされたらページをリロード
                                        window.location.reload();
                                    }
                                }
                            };
                        }
                    })
                    .catch(err => console.log('Service Worker registration failed', err));
            });
        }
    </script>
</body>
</html>
